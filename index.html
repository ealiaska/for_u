<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ASCII Букет — Белые розы ♥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-void: #000000;
      --border-subtle: #1d1d1d;
      --text-primary: #f5f7fa;
      --text-muted: #9aa3af;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 24px;
    }

    .font-serif-display {
      font-family: Georgia, "Times New Roman", "Palatino Linotype", serif;
    }

    .font-ascii {
      font-family: "JetBrains Mono", "Courier New", Courier, monospace;
    }

    .main-wrapper {
      width: 100%;
      max-width: 1200px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Стартовый экран с приглашением "Нажми на экран" */
    .tap-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      cursor: pointer;
      transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.8s ease;
    }

    .tap-overlay.dismissed {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @keyframes floatSparkle {
      0%, 100% {
        transform: translateY(0) scale(1);
        opacity: 0.85;
      }
      50% {
        transform: translateY(-5px) scale(1.08);
        opacity: 1;
      }
    }

    .tap-accent {
      font-size: 28px;
      color: #ffffff;
      text-shadow: 0 0 22px rgba(255, 255, 255, 0.65);
      animation: floatSparkle 2.8s ease-in-out infinite;
    }

    @keyframes pulsePrompt {
      0%, 100% {
        opacity: 0.72;
        text-shadow: 0 0 18px rgba(255, 255, 255, 0.25);
        letter-spacing: 0.04em;
      }
      50% {
        opacity: 1;
        text-shadow: 0 0 32px rgba(255, 255, 255, 0.7);
        letter-spacing: 0.07em;
      }
    }

    .tap-prompt-text {
      margin: 0;
      font-size: clamp(24px, 4.5vw, 38px);
      font-weight: 500;
      color: #ffffff;
      text-align: center;
      padding: 0 20px;
      animation: pulsePrompt 2.4s ease-in-out infinite;
    }

    .tap-subhint {
      margin: 0;
      font-size: 13px;
      color: #7c8594;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Рамка холста с букетом */
    .bouquet-frame {
      position: relative;
      width: 100%;
      height: 68vh;
      max-height: 70vh;
      min-height: 360px;
      border-radius: 16px;
      background-color: #000000;
      border: 1px solid var(--border-subtle);
      box-shadow:
        0 24px 64px rgba(0, 0, 0, 0.9),
        inset 0 0 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s ease;
    }

    @media (min-width: 640px) {
      body {
        padding: 18px 24px 28px;
      }
      .bouquet-frame {
        height: 70vh;
      }
    }

    .bouquet-frame:hover {
      border-color: #30343a;
    }

    #c {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000000;
    }

    /* Кнопка музыки в правом нижнем углу рамки */
    .music-btn {
      position: absolute;
      bottom: 14px;
      right: 14px;
      z-index: 10;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(18, 18, 20, 0.9);
      border: 1px solid #2b2d31;
      color: #e2e8f0;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s ease;
    }

    .music-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .music-btn:hover {
      background: #232529;
      border-color: #4b5058;
      color: #ffffff;
    }

    @keyframes pulseSilver {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(245, 247, 250, 0.35);
      }
      50% {
        box-shadow: 0 0 0 8px rgba(245, 247, 250, 0);
      }
    }

    .music-active {
      animation: pulseSilver 2.4s infinite;
      border-color: #cbd5e1 !important;
      color: #ffffff !important;
      background: #1f2228 !important;
    }

    /* Блок персональной подписи под букетом (плавно появляется после роста букета) */
    .footer-section {
      width: 100%;
      max-width: 680px;
      text-align: center;
      margin-top: 16px;
      padding: 0 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
      transition: opacity 1.1s cubic-bezier(0.22, 1, 0.36, 1), transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .footer-section.revealed {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .title-glow {
      margin: 0;
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
      text-shadow: 0 0 26px rgba(255, 255, 255, 0.28);
      line-height: 1.12;
    }

    .note-display {
      margin: 10px 0 0;
      max-width: 560px;
      padding: 9px 18px;
      border-radius: 12px;
      background: #0d0e11;
      border: 1px solid #22252a;
      color: #e2e8f0;
      font-style: italic;
      font-size: 16px;
      line-height: 1.45;
    }

    .subtitle-text {
      margin: 8px 0 0;
      font-size: 14.5px;
      color: #9aa3af;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <!-- Стартовый экран с приглашением нажать на экран -->
  <div id="intro" class="tap-overlay" role="button" tabindex="0" aria-label="Нажми на экран, чтобы открыть букет">
    <div class="tap-accent">✦ ❀ ✦</div>
    <p class="tap-prompt-text font-serif-display">Нажми на экран</p>
    <p class="tap-subhint">чтобы открыть букет</p>
  </div>

  <!-- Основной контейнер сцены с букетом -->
  <main class="main-wrapper">
    <div id="frameContainer" class="bouquet-frame">
      <!-- ASCII-холст на основе точных массивов R, S, L, Ld с автоцентрированием -->
      <canvas id="c"></canvas>

      <!-- Кнопка управления музыкой в правом нижнем углу рамки -->
      <button
        id="musicToggleBtn"
        type="button"
        aria-label="Включить или выключить музыку"
        title="Звук / Музыка"
        class="music-btn"
      >
        <span id="musicIcon">♫</span>
      </button>
    </div>

    <!-- Блок персональной подписи и послания под букетом -->
    <section id="footerSection" class="footer-section">
      <h1 id="recipientTitle" class="font-serif-display title-glow">
        Для тебя ♥
      </h1>

      <p id="customNoteDisplay" class="note-display font-serif-display">
        «Пусть эти белые розы напоминают тебе, как ты прекрасна.»
      </p>

      <p id="senderSubtitle" class="subtitle-text">
        С любовью ♥
      </p>
    </section>
  </main>

function insideOutline(x, y, outline) {
  let inside = false;
  for (let i = 0, j = outline.length - 1; i < outline.length; j = i++) {
    const [ax, ay] = outline[i], [bx, by] = outline[j];
    if ((ay > y) !== (by > y) && x < ax + ((bx - ax) * (y - ay)) / (by - ay)) inside = !inside;
  }
  return inside;
}

// Каждый символ рисунка принадлежит одной розе или окружающей листве.
const foliageCanvas = document.createElement('canvas');

foliageCanvas.height = cropH;

const flowerArt = FLOWER_ART.map((definition) => {
  const { outline } = definition;
  return {
    ...definition, layers: [[], []], sprite: document.createElement('canvas'),
    left: Math.min(...outline.map(([x]) => x)), right: Math.max(...outline.map(([x]) => x)),
    top: Math.min(...outline.map(([, y]) => y)), bottom: Math.max(...outline.map(([, y]) => y))
  };
});
const artByDepth = flowerArt.slice().reverse();
const owners = new Uint8Array(ROWS * COLS);
for (let row = 0; row < ROWS; row++) {
  const y = (row * FS + FS / 2 - cropY) / UNIT;
  for (let col = 0; col < COLS; col++) {
    if (!R[row]?.[col]?.trim() && !S[row]?.[col]?.trim()) continue;
    const x = (col * cw + cw / 2 - cropX) / UNIT;
    const owner = artByDepth.findIndex((art) => x >= art.left && x <= art.right && y >= art.top && y <= art.bottom && insideOutline(x, y, art.outline));
    owners[row * COLS + col] = owner + 1;
  }
}

for (const [layerIndex, layer] of [S, R].entries()) {
  layer.forEach((line, row) => {
    const runs = new Map();
    for (let col = 0; col < line.length; col++) {
      const char = line[col];
      if (char === ' ') continue;
      const owner = owners[row * COLS + col];
      const run = runs.get(owner) || { row, col, text: '' };
      run.text = run.text.padEnd(col - run.col, ' ') + char;
      runs.set(owner, run);
    }
    for (const [owner, run] of runs) {
      (artByDepth[owner - 1] || foliage).layers[layerIndex].push(run);
    }
  });
}

for (const art of flowerArt) {
  const lines = art.layers.flat();
  art.x = Math.floor(Math.min(...lines.map(({ col }) => col * cw))) - 6;
  art.y = Math.min(...lines.map(({ row }) => row * FS)) - 6;
  art.sprite.width = Math.ceil(Math.max(...lines.map(({ col, text }) => (col + text.length) * cw))) - art.x + 6;
  art.sprite.height = Math.max(...lines.map(({ row }) => (row + 1) * FS)) - art.y + 6;
  art.strips = [];
  for (let y = 0; y < art.sprite.height; y += FS * 3) {
    const height = Math.min(FS * 3, art.sprite.height - y);
    const nearby = lines.filter(({ row }) => row * FS + FS + 5 > y + art.y && row * FS - 5 < y + art.y + height);
    if (!nearby.length) continue;
    const x = Math.max(0, Math.floor(Math.min(...nearby.map(({ col }) => col * cw))) - art.x - 6);
    const right = Math.min(art.sprite.width, Math.ceil(Math.max(...nearby.map(({ col, text }) => (col + text.length) * cw))) - art.x + 6);
    art.strips.push({ x, y, width: right - x, height });
  }
}

for (const [i, bud] of buds.entries()) {
  const [tipX, tipY] = bud.tip;
  const spread = tipX - 449;
  const baseNudge = [-11, -13, 10, -6, 8, -12, 11, 3, -3][i];
  const bend = baseNudge * 1.62;
  const baseX = 449 + spread * 0.24 + baseNudge;
  const height = STEM_BOTTOM - tipY;
  bud.stem = [[baseX, STEM_BOTTOM], [baseX + spread * 0.13 + bend, STEM_BOTTOM - height * 0.38], [tipX - spread * 0.09 + bend, tipY + height * 0.31], bud.tip];
  bud.stemEnd = bud.delay + 1490 + height * 1.08;
  bud.openStart = bud.stemEnd + FLOWER_GROWTH.bud + FLOWER_GROWTH.pause;
  bud.openEnd = bud.openStart + FLOWER_GROWTH.opening + (i % 3) * 90;
  bud.phase = i * 1.43;
  bud.leafNodes = [[0.32, i % 2 ? 1 : -1], [0.62, i % 2 ? -1 : 1]];
  bud.stemSteps = Math.ceil(Math.hypot(tipX - baseX, height) / 5);
}

function paintRoseArt(target, art, x, y, theme) {
  target.font = font;
  target.textBaseline = 'top';
  target.shadowColor = theme.glow;
  target.shadowBlur = 5;
  for (const [index, layer] of art.layers.entries()) {
    target.fillStyle = index === 0 ? theme.soft : theme.rose;
    target.globalAlpha = index === 0 ? theme.softAlpha : theme.roseAlpha;
    for (const run of layer) target.fillText(run.text, run.col * cw - x, run.row * FS - y);
  }
  target.shadowBlur = 0;
  target.globalAlpha = 1;
}

function renderOffscreenLayers(colorKey) {
  const theme = THEMES[colorKey] || THEMES.white;
  foliageCtx.clearRect(0, 0, cropW, cropH);
  foliageCtx.font = font;
  foliageCtx.textBaseline = 'top';
  foliageCtx.fillStyle = theme.leafDark;
  foliageCtx.globalAlpha = theme.leafDarkAlpha;
  Ld.forEach((line, row) => foliageCtx.fillText(line, -cropX, row * FS - cropY));
  foliageCtx.fillStyle = theme.leaf;
  foliageCtx.globalAlpha = theme.leafAlpha;
  L.forEach((line, row) => foliageCtx.fillText(line, -cropX, row * FS - cropY));
  paintRoseArt(foliageCtx, foliage, cropX, cropY, theme);
  for (const art of flowerArt) {
    const target = art.sprite.getContext('2d');
    target.clearRect(0, 0, art.sprite.width, art.sprite.height);
    // Тень под лепестками закрывает стебли и листья, которые проходят позади цветка.
    target.fillStyle = '#000';
    target.beginPath();
    for (const [x, y] of art.outline) target.lineTo(x * UNIT + cropX - art.x, y * UNIT + cropY - art.y);
    target.closePath();
    target.fill();
    paintRoseArt(target, art, art.x, art.y, theme);
  }
}

function clamp01(value) {
  return Math.max(0, Math.min(1, value));
}

function ease(value) {
  return (1 - Math.cos(Math.PI * clamp01(value))) / 2;
}

function mix(from, to, progress) {
  return from + (to - from) * progress;
}

function stemPoint(bud, t, windX, windY) {
  const [base, cp1, cp2, tip] = bud.stem;
  const s = 1 - t, tipWeight = t * t;
  return [0, 1].map((axis) => s ** 3 * base[axis] + 3 * s * s * t * cp1[axis] + 3 * s * t * t * cp2[axis] + t ** 3 * tip[axis] + tipWeight * (axis ? windY : windX));
}

function drawLeaf(x, y, angle, length, width, theme) {
  if (length < 2) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.strokeStyle = theme.leafDark;
  ctx.lineWidth = Math.min(1.5, width * 0.33);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(length * 0.55, width * 0.32, length, 0);
  ctx.stroke();

  const steps = Math.ceil(length / 4);
  ctx.font = 'bold 6px "Courier New", monospace';
  ctx.fillStyle = theme.leaf;
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const edge = Math.sin(Math.PI * t) * width * (0.91 + (i % 2) * 0.15);
    ctx.fillText(i % 2 ? '+' : ':', length * t, 0);
    ctx.fillText(i % 2 ? '.' : ',', length * t, -edge);
    ctx.fillText(i % 2 ? ',' : '.', length * t, edge * 0.72);
  }
  ctx.restore();
}

function drawStem(bud, progress, windX, windY, theme) {
  const steps = Math.max(1, Math.ceil(bud.stemSteps * progress));
  const points = Array.from({ length: steps + 1 }, (_, i) => stemPoint(bud, progress * i / steps, windX, windY));
  ctx.strokeStyle = theme.leafDark;
  ctx.lineWidth = 1.65;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for (let i = 1; i <= steps; i++) ctx.lineTo(...points[i]);
  ctx.stroke();

  ctx.font = 'bold 7px "Courier New", monospace';
  ctx.globalAlpha = 0.88;
  ctx.fillStyle = theme.leaf;
  for (let i = 1; i <= steps; i++) {
    const [x, y] = points[i];
    const [lastX, lastY] = points[i - 1];
    const dx = x - lastX, dy = y - lastY;
    const char = Math.abs(dx) < Math.abs(dy) * 0.42 ? '|' : dx > 0 ? '/' : '\\';
    ctx.fillText(char, x, y);
  }
  ctx.globalAlpha = 1;

  for (const [node, side] of bud.leafNodes) {
    const spread = ease((progress - node) / 0.32);
    const [x, y] = stemPoint(bud, node, windX, windY);
    const length = Math.min(46, (STEM_BOTTOM - bud.tip[1]) * 0.22) * spread;
    drawLeaf(x, y, -Math.PI / 2 + side * (0.32 + 0.86 * spread), length, length * 0.20, theme);
  }
}

function drawCalyx(x, y, tilt, form, opening, size, theme) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);
  drawLeaf(0, 0, -Math.PI / 2, 7 * form * size, 1.8 * size, theme);
  const flare = ease(opening / 0.62);
  for (const side of [-1, 1]) {
    const angle = -Math.PI / 2 + side * mix(0.26, 1.82, flare);
    drawLeaf(0, 0, angle, mix(25, 15, flare) * form * size, 2.8 * form * size, theme);
  }
  ctx.restore();
}

// Одна текстура лепестков меняет форму вокруг чашелистика. Наружные лепестки
// расходятся первыми, сердцевина раскрывается с задержкой.
function drawRose(bud, x, y, tilt, form, opening) {
  const { art } = bud;
  const [anchorX, anchorY] = art.tip;
  const left = (art.x - cropX) / UNIT - anchorX;
  const top = (art.y - cropY) / UNIT - anchorY;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);
  const size = bud.size * form;
  ctx.scale(bud.mirror ? -size : size, size);
  if (opening >= 1) {
    ctx.drawImage(art.sprite, left, top, art.sprite.width / UNIT, art.sprite.height / UNIT);
    ctx.restore();
    return;
  }

  const outer = ease(opening / 0.82);
  const inner = ease((opening - 0.27) / 0.73);
  const rise = ease(opening / 0.91);
  const sourceCuts = [0, 0.29, 0.71, 1];
  for (const { x: sx, y: sy, width: sw, height: sh } of art.strips) {
    const band = (sy + sh / 2) / art.sprite.height;
    const closedWidth = 25 * (0.17 + 0.83 * Math.sin(Math.PI * band) ** 0.88);
    const openWidth = sw / UNIT;
    const openCenter = left + (sx + sw / 2) / UNIT;
    const center = mix(Math.sin(Math.PI * band) * -1.5, openCenter, rise);
    const half = mix(closedWidth, openWidth, outer) / 2;
    const middle = mix(closedWidth, openWidth, inner) * 0.21;
    const a = Math.min(middle, half * 0.77);
    const cuts = [center - half, center - a, center + a, center + half];
    const startY = mix(-49 + 49 * sy / art.sprite.height, top + sy / UNIT, rise);
    const height = mix(49 * sh / art.sprite.height, sh / UNIT, rise);
    for (let i = 0; i < 3; i++) {
      const sourceWidth = sw * (sourceCuts[i + 1] - sourceCuts[i]);
      ctx.drawImage(art.sprite, sx + sw * sourceCuts[i], sy, sourceWidth, sh,
        cuts[i], startY, cuts[i + 1] - cuts[i] + 0.12, height + 0.16);
    }
  }
  ctx.restore();
}

function drawFoliage(elapsed) {
  const bandHeight = 60;
  for (let y = 0; y < cropH; y += bandHeight) {
    const height = Math.min(bandHeight, cropH - y);
    const level = 1 - (y + height / 2) / cropH;
    const visible = ease((elapsed - mix(1500, FULL_BLOOM_MS - 1550, level)) / 1050);
    if (visible <= 0) continue;
    ctx.globalAlpha = visible;
    ctx.drawImage(foliageCanvas, 0, y, cropW, height, 0, y / UNIT, ART_WIDTH, height / UNIT);
  }
  ctx.globalAlpha = 1;
}

function frame(ms) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cropW, cropH);
  if (!started) return;

  if (growStartMs === null) growStartMs = ms;
  const elapsed = still ? FULL_BLOOM_MS : ms - growStartMs;
  const theme = THEMES[currentColorKey] || THEMES.white;
  const wind = ease((elapsed - FULL_BLOOM_MS) / 1450);
  const time = ms / 1000;
  ctx.setTransform(UNIT, 0, 0, UNIT, 0, 0);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  drawFoliage(elapsed);

  const heads = [];
  for (const bud of buds) {
    const progress = ease((elapsed - bud.delay) / (bud.stemEnd - bud.delay));
    if (progress <= 0) continue;
    const windX = wind * 2.6 * Math.sin(time * 1.7 + bud.phase);
    const windY = wind * 0.7 * Math.cos(time * 1.4 + bud.phase);
    drawStem(bud, progress, windX, windY, theme);
    const form = ease((elapsed - bud.stemEnd) / FLOWER_GROWTH.bud);
    if (form <= 0) continue;

    const [x, y] = stemPoint(bud, 1, windX, windY);
    const [prevX, prevY] = stemPoint(bud, 0.98, windX, windY);
    const opening = clamp01((elapsed - bud.openStart) / (bud.openEnd - bud.openStart));
    const naturalTilt = Math.atan2(x - prevX, prevY - y);
    const tilt = Math.max(-0.58, Math.min(0.58, naturalTilt)) * (1 - ease(opening));
    heads.push({ bud, x, y, tilt, form, opening });
  }
  for (const { bud, x, y, tilt, form, opening } of heads) {
    drawRose(bud, x, y, tilt, form, opening);
    drawCalyx(x, y, tilt, form, opening, bud.size, theme);
  }

  if (!messageRevealed && elapsed >= FULL_BLOOM_MS) {
    messageRevealed = true;
    document.getElementById('footerSection').classList.add('revealed');
  }
  if (!still) rafId = requestAnimationFrame(frame);
}


// --- Уникальное послание, музыка и запуск по нажатию на экран ---
(function () {
  const introOverlay = document.getElementById('intro');
  const recipientTitle = document.getElementById('recipientTitle');
  const senderSubtitle = document.getElementById('senderSubtitle');
  const customNoteDisplay = document.getElementById('customNoteDisplay');
  const musicToggleBtn = document.getElementById('musicToggleBtn');

  // Текст вашего уникального послания (можете вписать сюда имя девушки и свои слова)
  const GIFT_CONFIG = {
    to: '', // Например: 'Любимой' или имя (если пусто — будет «Для тебя ♥»)
    note: 'Пусть эти белые розы напоминают тебе, как ты прекрасна.',
    from: 'С любовью ♥',
    color: 'white' // 'white', 'champagne' или 'pink'
  };

  function applyGiftContent() {
    let to = GIFT_CONFIG.to;
    let note = GIFT_CONFIG.note;
    let from = GIFT_CONFIG.from;
    let color = GIFT_CONFIG.color;

    // При желании текст всё ещё можно переопределить через параметры URL (?to=...&msg=...&from=...)
    try {
      const params = new URLSearchParams(window.location.search);
      if (params.get('to') || params.get('t')) to = (params.get('to') || params.get('t')).trim();
      if (params.get('msg') || params.get('note') || params.get('n')) {
        note = (params.get('msg') || params.get('note') || params.get('n')).trim();
      }
      if (params.get('from') || params.get('f')) from = (params.get('from') || params.get('f')).trim();
      const rawColor = (params.get('color') || '').trim().toLowerCase();
      if (THEMES[rawColor]) color = rawColor;
    } catch (e) {
      // Игнорируем в изолированных окружениях
    }

    if (to) {
      const hasHeart = to.includes('♥') || to.includes('❤');
      recipientTitle.textContent = hasHeart ? to : `Для ${to} ♥`;
      document.title = `Для ${to} ♥`;
    } else {
      recipientTitle.textContent = 'Для тебя ♥';
      document.title = 'Для тебя ♥';
    }

    customNoteDisplay.textContent = `«${note}»`;
    senderSubtitle.textContent = from;

    currentColorKey = THEMES[color] ? color : 'white';
    renderOffscreenLayers(currentColorKey);
  }

  // --- Генеративная мелодия на Web Audio API ---
  let audioCtx = null;
  let reverbNode = null;
  let isMusicPlaying = false;
  let melodyTimer = null;
  let noteStep = 0;

  const MELODY_FREQS = [
    440.00, 523.25, 659.25, 987.77, 880.00, 659.25,
    349.23, 440.00, 523.25, 659.25, 783.99, 523.25,
    261.63, 392.00, 493.88, 587.33, 659.25, 493.88,
    392.00, 493.88, 659.25, 783.99, 659.25, 493.88
  ];

  function createImpulseResponse(context, duration, decay) {
    const rate = context.sampleRate;
    const length = rate * duration;
    const impulse = context.createBuffer(2, length, rate);
    for (let ch = 0; ch < 2; ch++) {
      const data = impulse.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
      }
    }
    return impulse;
  }

  function playMusicBoxNote(freq) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const harmonic = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const harmonicGain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);

    harmonic.type = 'triangle';
    harmonic.frequency.setValueAtTime(freq * 2, now);

    harmonicGain.gain.setValueAtTime(0.015, now);
    harmonicGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.06, now + 0.025);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.85);

    osc.connect(gain);
    harmonic.connect(harmonicGain);
    harmonicGain.connect(gain);

    gain.connect(audioCtx.destination);
    if (reverbNode) {
      gain.connect(reverbNode);
    }

    osc.start(now);
    harmonic.start(now);
    osc.stop(now + 1.9);
    harmonic.stop(now + 1.9);
  }

  function toggleMusic() {
    if (!isMusicPlaying) {
      startMusic();
    } else {
      stopMusic();
    }
  }

  function startMusic() {
    if (isMusicPlaying) return;
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) {
        audioCtx = new AudioContextClass();
        reverbNode = audioCtx.createConvolver();
        reverbNode.buffer = createImpulseResponse(audioCtx, 2.3, 2.8);
        const wetGain = audioCtx.createGain();
        wetGain.gain.value = 0.30;
        reverbNode.connect(wetGain);
        wetGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      isMusicPlaying = true;
      musicToggleBtn.classList.add('music-active');
      document.getElementById('musicIcon').textContent = '♫';

      playMusicBoxNote(MELODY_FREQS[noteStep % MELODY_FREQS.length]);
      noteStep++;

      melodyTimer = setInterval(() => {
        if (!isMusicPlaying) return;
        playMusicBoxNote(MELODY_FREQS[noteStep % MELODY_FREQS.length]);
        noteStep++;
      }, 540);
    } catch (e) {
      // Аудио недоступно
    }
  }

  function stopMusic() {
    isMusicPlaying = false;
    musicToggleBtn.classList.remove('music-active');
    document.getElementById('musicIcon').textContent = '✕';
    clearInterval(melodyTimer);
  }

  // Запуск роста букета и музыки по первому нажатию на экран
  function triggerBouquetExperience() {
    if (started) return;
    started = true;
    growStartMs = performance.now();
    introOverlay.classList.add('dismissed');
    musicToggleBtn.classList.add('visible');
    try {
      startMusic();
    } catch (err) {
      // Игнорируем возможные ограничения Web Audio API
    }
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(frame);
  }

  introOverlay.addEventListener('pointerdown', triggerBouquetExperience);
  introOverlay.addEventListener('click', triggerBouquetExperience);
  introOverlay.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      triggerBouquetExperience();
    }
  });

  musicToggleBtn.addEventListener('click', toggleMusic);

  applyGiftContent();
})();
  </script>
